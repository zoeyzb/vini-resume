name: Bootstrap Vineet portfolio v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-vineet-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy Sierra portfolio source
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/zoeyzb/sierra-portfolio.git "$tmp/source"
          rsync -a --delete --exclude '.git' --exclude '.github' "$tmp/source/" ./

      - name: Write failing Vineet content tests
        run: |
          cat > src/data/vineet-content.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { education, experience, profile } from "./content";

          describe("Vineet portfolio content", () => {
            it("uses Vineet Singh as the portfolio identity", () => {
              expect(profile.name).toBe("Vineet Singh");
              expect(profile.location).toBe("Galesburg, Illinois");
              expect(profile.email).toBe("vineet.singh14204@gmail.com");
            });

            it("uses Vineet's Knox College education", () => {
              expect(education).toEqual([
                {
                  school: "Knox College, Galesburg, IL",
                  detail: "B.S. Computer Science · B.A. Business (Accounting & Finance)",
                  period: "Graduating Winter 2026",
                },
              ]);
            });

            it("includes the highlighted F&M Bank teller role", () => {
              const bank = experience.find((job) => job.role === "Bank Teller" && job.org === "F&M Bank");
              expect(bank).toBeDefined();
              expect(bank?.period).toBe("Sep 2023 – Sep 2024");
              expect(bank?.tags[0]).toBe("Highlighted");
              expect(bank?.points).toContain("Processed $3–4M+ in financial transactions with zero compliance errors");
              expect(bank?.points).toContain("Identified cross-selling opportunities while maintaining high accuracy and risk awareness");
            });
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Confirm RED before implementation
        run: |
          set +e
          npm test -- src/data/vineet-content.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the Vineet test to fail before the content update."
            exit 1
          fi
          echo "RED confirmed."

      - name: Apply approved Vineet content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          content_path = Path("src/data/content.ts")
          text = content_path.read_text()

          text = re.sub(
              r'export const profile = \{.*?\n\};',
              '''export const profile = {
            name: "Vineet Singh",
            location: "Galesburg, Illinois",
            email: "vineet.singh14204@gmail.com",
            role: "AI Automation & Product Operations",
            roleSecondary:
              "Customer-facing workflows, internal tools, and revenue operations.",
            summary: "I build AI workflows and digital products for customer acquisition, service, and follow-up.",
          };''',
              text,
              count=1,
              flags=re.S,
          )

          text = re.sub(
              r'export const links = \{.*?\n\};',
              '''export const links = {
            email: "vineet.singh14204@gmail.com",
            linkedin: "https://linkedin.com/in/vsingh14204",
            github: "https://github.com/VineetSingh142004",
          };''',
              text,
              count=1,
              flags=re.S,
          )

          text = re.sub(
              r'export const education = \[.*?\n\];',
              '''export const education = [
            {
              school: "Knox College, Galesburg, IL",
              detail: "B.S. Computer Science · B.A. Business (Accounting & Finance)",
              period: "Graduating Winter 2026",
            },
          ];''',
              text,
              count=1,
              flags=re.S,
          )

          bank_entry = '''export const experience = [
            {
              role: "Bank Teller", org: "F&M Bank", period: "Sep 2023 – Sep 2024",
              tags: ["Highlighted", "Financial operations", "Compliance"],
              flow: ["Transaction received", "Identity verified", "Transaction processed", "Compliance checked"],
              points: [
                "Processed $3–4M+ in financial transactions with zero compliance errors",
                "Identified cross-selling opportunities while maintaining high accuracy and risk awareness",
              ],
            },'''
          text = text.replace("export const experience = [", bank_entry, 1)
          text = text.replace(
              'export const RESUME_HREF = "/Sierra_Byrd_Resume.pdf";',
              'export const RESUME_HREF = "https://github.com/VineetSingh142004";',
          )
          content_path.write_text(text)

          replacements = {
              "Sierra Byrd": "Vineet Singh",
              "sbyrd23@csu.edu": "vineet.singh14204@gmail.com",
              "Chicago, Illinois": "Galesburg, Illinois",
          }

          for file in [Path("index.html"), Path("README.md")]:
              if file.exists():
                  s = file.read_text()
                  for old, new in replacements.items():
                      s = s.replace(old, new)
                  file.write_text(s)

          for file in Path("src").rglob("*"):
              if file.suffix not in {".ts", ".tsx"} or file == content_path:
                  continue
              s = file.read_text()
              for old, new in replacements.items():
                  s = s.replace(old, new)
              file.write_text(s)
          PY
          rm -f public/Sierra_Byrd_Resume.pdf

      - name: Verify tests
        run: npm test

      - name: Verify lint
        run: npm run lint

      - name: Verify production build
        run: npm run build

      - name: Commit completed Vineet portfolio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Vineet portfolio from Sierra design"
          git push origin HEAD:main
